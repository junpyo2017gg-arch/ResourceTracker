<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Tracker</title>

    <link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="icon-192.png">
</head>

<header class="header">
    <h1>🎮 Resource Tracker</h1>

    <div class="game-bar">
        <select id="gameSelect"></select>

        <button id="addGameBtn" title="게임 추가">
            +
        </button>
    </div>
</header>

<main>

    <section class="card">

        <div class="title-row">
            <h2>재화 입력</h2>

            <button id="addResourceBtn">
                + 재화
            </button>
        </div>

        <div id="resourceContainer">

        </div>

        <button id="saveRecordBtn" class="mainButton">
            한 판 기록하기
        </button>

    </section>

    <section class="card">

        <h2>총 재화</h2>

        <div id="totalContainer">

        </div>

    </section>

    <section class="card">

        <h2>최근 기록</h2>

        <div id="historyContainer">

            아직 기록이 없습니다.

        </div>

    </section>

</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">확인</h3>
    <p id="modalMessage"></p>

    <div class="modal-buttons">
      <button id="modalCancel">취소</button>
      <button id="modalConfirm" class="danger">삭제</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
